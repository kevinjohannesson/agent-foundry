<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Foundry</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --needs: #d9480f; --working: #1971c2; --waiting: #2b8a3e; --idle: #868e96; --ended: #adb5bd;
    --badge: #eeeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #30302d;
      --needs: #ff8a4c; --working: #5aa9ff; --waiting: #69db7c; --idle: #909296; --ended: #5c5f66;
      --badge: #2c2c29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .summary { color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; }
  .controls { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--muted); }
  .conn { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--badge); }
  .conn.down { color: var(--needs); }
  main { padding: 0 16px 24px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 980px; }
  th { text-align: left; font-weight: 500; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.ended td { opacity: .55; }
  .status { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .s-needs_you { color: var(--needs); } .s-working { color: var(--working); } .s-waiting { color: var(--waiting); }
  .s-idle { color: var(--idle); } .s-ended { color: var(--ended); }
  .s-working .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .mono { display: inline-block; min-width: 26px; text-align: center; font: 600 11px/18px ui-monospace, Menlo, monospace; background: var(--badge); border-radius: 4px; margin-right: 6px; }
  .name { font-weight: 500; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now { min-width: 200px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .now.alert { color: var(--needs); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Agent Foundry</h1>
  <div class="summary" id="summary"></div>
  <div class="controls">
    <label><input type="checkbox" id="showEnded"> Ended</label>
    <label><input type="checkbox" id="showArchived"> Archived</label>
    <span class="conn down" id="conn">connecting</span>
  </div>
</header>
<main>
  <table>
    <thead><tr>
      <th>Status</th><th>Session</th><th>App</th><th>Folder</th><th>Now</th><th>Tools</th><th>Agents</th><th>Mode</th><th>Active</th><th>Status from</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No sessions yet. Start one, or install the hooks with <code>pnpm hooks:install</code>.</div>
</main>
<script type="module">
// A renderer: it draws the core's state and never works out status itself.
const STATUS = { needs_you: "Needs you", working: "Working", waiting: "Your move", idle: "Idle", ended: "Ended" };
const ORDER = ["needs_you", "working", "waiting", "idle", "ended"];
const APPS = { "claude-desktop": "Desktop", "claude-vscode": "VS Code", cli: "CLI", "sdk-cli": "SDK" };

let state = null;
let queued = false;
const $ = (id) => document.getElementById(id);
const prefs = (() => { try { return JSON.parse(localStorage.getItem("foundry.table") || "{}"); } catch { return {}; } })();
for (const k of ["showEnded", "showArchived"]) {
  $(k).checked = !!prefs[k];
  $(k).addEventListener("change", () => { prefs[k] = $(k).checked; try { localStorage.setItem("foundry.table", JSON.stringify(prefs)); } catch {} draw(); });
}

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) if (v !== undefined && v !== null) e[k] = v;
  for (const kid of kids) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
}

function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  return `${Math.floor(s / 86400)}d`;
}

function folder(cwd) {
  if (!cwd) return "—";
  const wt = cwd.match(/\/([^/]+)\/\.claude\/worktrees\/([^/]+)/);
  if (wt) return `${wt[1]} ⎇ ${wt[2]}`;
  return cwd.split("/").filter(Boolean).pop() || cwd;
}

function draw() {
  queued = false;
  if (!state) return;
  const all = Object.values(state.sessions).filter((s) => !s.pending);  // pending: nothing happened yet, or a pre-warmed ghost
  const shown = all
    .filter((s) => ($("showArchived").checked || !s.archived) && ($("showEnded").checked || s.status !== "ended"))
    .sort((a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || b.lastActivityAt - a.lastActivityAt);

  const counts = {};
  for (const s of all) if (!s.archived) counts[s.status] = (counts[s.status] || 0) + 1;
  $("summary").replaceChildren(...ORDER.filter((k) => counts[k]).flatMap((k, i) => [i ? " · " : "", el("b", { textContent: counts[k] }), ` ${STATUS[k].toLowerCase()}`]));

  $("rows").replaceChildren(...shown.map((s) => {
    const agents = Object.values(s.agents);
    const running = agents.filter((a) => a.running).map((a) => `${a.type}: ${a.description ?? ""}`).join("\n");
    const alert = s.status === "needs_you" && s.notification;
    return el("tr", { className: s.status === "ended" ? "ended" : "" },
      el("td", {}, el("span", { className: `status s-${s.status}` }, el("span", { className: "dot" }), STATUS[s.status] ?? s.status)),
      el("td", { title: s.id },
        el("div", {}, el("span", { className: "mono", textContent: s.mono }), el("span", { className: "name", textContent: s.name })),
        s.title && s.title !== s.name ? el("div", { className: "sub", textContent: s.title, title: s.title }) : null),
      el("td", { textContent: APPS[s.entrypoint] ?? s.entrypoint ?? "—", className: s.entrypoint ? "" : "muted" }),
      el("td", {}, el("div", { className: "folder", textContent: folder(s.cwd), title: s.cwd ?? "" })),
      el("td", {}, el("div", { className: `now${alert ? " alert" : ""}`, textContent: alert ? s.notification : (s.lastPrompt ?? ""), title: alert ? s.notification : (s.lastPrompt ?? "") })),
      el("td", { className: "num" }, s.lastTool ?? "", s.toolCalls ? el("span", { className: "muted", textContent: ` ×${s.toolCalls}` }) : null),
      el("td", { className: "num", title: running }, agents.length ? `${s.activeSubagents} / ${s.subagentsTotal}` : el("span", { className: "muted", textContent: "—" })),
      el("td", { textContent: s.permissionMode ?? "—", className: s.permissionMode ? "" : "muted" }),
      el("td", { className: "num", textContent: ago(s.lastActivityAt), title: new Date(s.lastActivityAt).toLocaleString() }),
      el("td", { className: "muted", textContent: s.statusFrom ?? "—", title: s.lastHookAt ? `last hook event ${ago(s.lastHookAt)} ago` : "no hook events yet" }),
    );
  }));
  $("empty").hidden = all.length > 0;
}

function schedule() { if (!queued) { queued = true; requestAnimationFrame(draw); } }
setInterval(schedule, 15000); // keep the "Active" column honest

let retry = 500;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retry = 500; $("conn").textContent = "live"; $("conn").classList.remove("down"); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "snapshot" || msg.type === "event") { state = msg.state; schedule(); }
  };
  ws.onclose = () => {
    $("conn").textContent = "reconnecting"; $("conn").classList.add("down");
    setTimeout(connect, retry); retry = Math.min(retry * 2, 10000);
  };
}
connect();
</script>
</body>
</html>
